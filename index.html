<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>專科護理師考古題練習</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ── HOME ── -->
<div id="screen-home">
  <div class="home-header">
    <h1>專科護理師考古題練習</h1>
    <p id="home-tagline"></p>
  </div>
  <div id="exam-list"></div>
</div>

<!-- ── QUIZ ── -->
<div id="screen-quiz">
  <div class="quiz-header">
    <span class="quiz-title" id="quiz-title"></span>
    <span class="quiz-progress-text" id="quiz-progress-text"></span>
  </div>
  <div class="progress-wrap">
    <div class="progress-grid" id="progress-grid"></div>
  </div>
  <div class="quiz-body">
    <div class="question-num" id="question-num"></div>
    <div class="question-stem" id="question-stem"></div>
    <div class="question-image" id="question-image" style="display:none"></div>
    <div class="multi-hint" id="multi-hint" style="display:none">★ 複選題，請選出所有正確答案</div>
    <div class="free-hint" id="free-hint" style="display:none">本題為送分題，任何答案皆得分</div>
    <div class="options-list" id="options-list"></div>
    <div class="feedback" id="feedback"></div>
  </div>
  <div class="quiz-footer">
    <button class="btn btn-outline" id="btn-prev" onclick="goPrev()">◀ 上一題</button>
    <button class="btn btn-outline" id="btn-skip" onclick="skipQuestion()">跳過</button>
    <button class="btn btn-primary" id="btn-confirm" onclick="confirmAnswer()">確認答案</button>
    <button class="btn btn-outline" id="btn-next" onclick="goNext()">下一題 ▶</button>
    <button class="btn btn-danger" id="btn-finish" onclick="finishExam()">結束測驗</button>
  </div>
</div>

<!-- ── RESULT ── -->
<div id="screen-result">
  <div class="result-header">
    <h1 id="result-title">測驗結果</h1>
  </div>
  <div class="score-card">
    <div class="score-big" id="score-big"></div>
    <div class="score-label" id="score-label"></div>
    <div class="score-stats">
      <div class="stat"><div class="stat-num green" id="stat-correct"></div><div class="stat-label">答對</div></div>
      <div class="stat"><div class="stat-num red" id="stat-wrong"></div><div class="stat-label">答錯</div></div>
      <div class="stat"><div class="stat-num orange" id="stat-skip"></div><div class="stat-label">未作答</div></div>
    </div>
  </div>
  <div class="result-actions">
    <button class="btn btn-outline" onclick="goHome()">← 返回首頁</button>
    <button class="btn btn-primary" id="btn-retry-wrong" onclick="retryWrong()">重做錯題</button>
  </div>
  <div class="result-table">
    <div class="result-table-header">答題明細</div>
    <div class="result-row header">
      <div>題號</div><div>題目</div><div>作答</div><div>正確答案</div><div>結果</div>
    </div>
    <div id="result-rows"></div>
  </div>
</div>

<!-- Image lightbox -->
<div class="img-modal" id="img-modal" onclick="closeImgModal()">
  <span class="img-modal-close">✕</span>
  <img id="modal-img" src="" alt="">
</div>

<script src="app.js"></script>
</body>
</html>
